name: Backend CI

# 프론트(Flutter)만 바뀐 PR에서는 돌지 않는다
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

# 백엔드는 모노레포의 backend/ 아래에 있다
defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: backpack
          MYSQL_USER: backpack
          MYSQL_PASSWORD: backpack
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # 컴파일 + 테스트(H2) + bootJar
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build

      # 테스트는 H2라 마이그레이션을 실행하지 않는다. 빌드한 jar를 실제 MySQL에 prod 프로필로 띄워
      # Flyway 적용과 엔티티-스키마 검증(ddl-auto: validate)이 통과하는지 확인한다
      - name: Boot against MySQL
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:mysql://127.0.0.1:3306/backpack
          DB_USERNAME: backpack
          DB_PASSWORD: backpack
          REDIS_HOST: localhost
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
          # CI에는 Firebase 키가 없으므로 푸시를 명시적으로 끈다
          FIREBASE_CREDENTIALS_PATH: ""
          STORAGE_PUBLIC_BASE_URL: http://localhost:8080/files
        run: bash ./scripts/smoke-boot.sh

  # Dockerfile이 깨지지 않았는지 이미지를 실제로 빌드해 확인한다 (푸시하지 않는다)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t backpack-backend:ci .
