spring:
  application:
    name: backend
  profiles:
    default: dev
  datasource:
    hikari:
      # 세션 시간대를 UTC로 고정한다. 앱이 시각을 UTC로 저장하므로
      # DB의 CURRENT_TIMESTAMP도 서버 시간대 설정과 무관하게 UTC여야 한다
      connection-init-sql: "SET time_zone = '+00:00'"
  servlet:
    multipart:
      # 넘으면 413 PAYLOAD_TOO_LARGE. 앱은 올리기 전에 이미지를 줄여서 보낸다
      max-file-size: 10MB
      max-request-size: 11MB
  # ImageStorage가 저장한 파일을 /files/{키}로 내려준다
  mvc:
    static-path-pattern: /files/**
  web:
    # 유효성 검사 메시지(ErrorResponse.details)를 항상 한국어로 내려준다.
    # 고정하지 않으면 서버 로케일을 따라가서 운영 컨테이너(영어)에서는 영어 메시지가 나간다
    locale: ko_KR
    locale-resolver: fixed
    resources:
      static-locations: "file:${storage.root-path}/"
      cache:
        cachecontrol:
          # 키가 매번 새로 만들어지고 덮어쓰지 않으므로 앱이 오래 캐시해도 된다
          max-age: 365d
  # @Async 메서드를 실행하는 스레드 풀 (AsyncConfig)
  task:
    execution:
      thread-name-prefix: async-
      # 배포로 서버가 내려갈 때 실행 중인 작업(푸시 발송 등)이 끝나기를 기다린다
      shutdown:
        await-termination: true
        await-termination-period: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    redis:
      # 캐시 기본 수명. 키는 "backpack:cache:{캐시이름}::{키}" 형태로 저장된다
      time-to-live: 10m
      key-prefix: "backpack:cache:"
  data:
    redis:
      # Redis가 응답하지 않을 때 요청이 오래 매달리지 않게 한다 (기본값은 연결 10초, 명령 60초)
      connect-timeout: 2s
      timeout: 2s
      # Redis는 RedisTemplate으로만 쓴다. 켜 두면 JPA 리포지토리까지 Redis용으로 스캔한다
      repositories:
        enabled: false

# 이미지 저장 폴더. 로컬은 프로젝트 루트의 storage/, 도커에서는 /app/storage (Dockerfile 참고)
storage:
  root-path: ${STORAGE_ROOT_PATH:./storage}

server:
  tomcat:
    # 크기 제한을 넘은 업로드는 본문을 다 읽기 전에 거절된다. 남은 본문을 이만큼까지는 읽어서 버려야
    # 앱이 연결 끊김 대신 413 응답을 받는다 (기본값 2MB로는 큰 사진에서 연결이 끊긴다)
    max-swallow-size: 50MB

firebase:
  # FCM 서비스 계정 키(JSON) 파일 경로. 비워 두면 푸시 발송이 꺼진다
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# 환율 수집 (budget.service.rate). 저장한 값은 exchange_rates에 쌓이고 다시 바뀌지 않는다
exchange-rate:
  # false면 외부 API를 부르지 않고 DB에 있는 값만 쓴다 (테스트·오프라인 개발)
  fetch-enabled: ${EXCHANGE_RATE_FETCH_ENABLED:true}
  # 한국수출입은행 인증키. 있으면 가장 먼저 쓰고, 없으면 ECB(frankfurter) → open.er-api 순서로 쓴다
  exim-api-key: ${EXIM_API_KEY:}
  # 미리 받아 둘 통화 (여행에 쓰이는 통화는 자동으로 더한다)
  default-currencies: JPY,USD,EUR,CNY,TWD,HKD,THB,VND,SGD,PHP,GBP,AUD
  # 한국 시간 기준 2시간마다 20분에
  collect-cron: "0 20 */2 * * *"

# 지도 · 장소 · 이동 시간 (OpenStreetMap 기반 무료 공용 서버, 키 없음). place.service.OsmClient 참고
map:
  nominatim-url: ${MAP_NOMINATIM_URL:https://nominatim.openstreetmap.org}
  osrm-foot-url: ${MAP_OSRM_FOOT_URL:https://routing.openstreetmap.de/routed-foot}
  # 공용 서버 사용 정책: 어떤 앱이 부르는지 알 수 있게 한다
  user-agent: ${MAP_USER_AGENT:Backpack/1.0 (+https://github.com/sasiljangnan2/Backpack_Crop)}
  # false면 외부 서버를 부르지 않고 직선거리 어림값만 쓴다 (테스트 · 오프라인 개발)
  fetch-enabled: ${MAP_FETCH_ENABLED:true}

# Google Maps Platform 서버 키 (Places API (New) · Routes API). 있으면 장소 검색 · 이동 시간을 구글로 하고,
# 없거나 실패하면 위의 OpenStreetMap으로 대신한다. 결제 계정이 필요하다 (docs/google-maps.md)
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

# AI 일정 재구성 (BP-AI-002 · 003). 키가 없거나 응답이 늦으면 규칙 기반 추천으로 대신한다
ai:
  gemini:
    # Google AI Studio에서 무료로 받는 키 (https://aistudio.google.com/apikey)
    api-key: ${GEMINI_API_KEY:}
    # 아래 모델들에 한꺼번에 묻고 가장 먼저 온 답을 쓴다 (모두 무료 등급이 있다).
    # 무료 등급에서 재 보니(2026-10) 같은 모델도 3초 만에 답하거나, 붐빈다며(503) 거절하거나, 40초가 넘게 걸렸다
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-3.8-flash}
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
    # Gemini 답을 기다리는 시간. 넘으면 규칙 기반 추천으로 답한다
    timeout: 25s
  # 재구성 요청에서 AI(Gemini + 새 장소 찾기)를 기다리는 최대 시간 (앱은 45초까지 기다린다)
  replan-timeout: 30s

app:
  demo:
    # 시연용 고정 시각 (ISO-8601 UTC, 예: 2026-10-03T05:50:00Z = 도쿄 14:50). 비워 두면 실제 시각
    # 운영에서는 설정하지 않는다
    now: ${APP_DEMO_NOW:}

jwt:
  # 어떤 프로필에도 기본값을 두지 않는다. 없으면 기동 실패 (로컬은 .env에 설정, dev 프로필만 .env를 읽는다)
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d
